name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: releases the version in package.json from the selected branch and creates the tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: Resolve tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
          echo "TAG=$version" >> "$GITHUB_ENV"
      - run: pnpm test
      - run: python3 scripts/create_zip.py
      - run: sha256sum decky-renodx.zip > decky-renodx.zip.sha256
      - name: Release notes
        run: |
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="${TAG#v}" '
            /^## / { if (found) exit; if ($0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${TAG#v}; add release notes before releasing."
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" decky-renodx.zip decky-renodx.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Decky RenoDX $TAG" \
            --notes-file notes.md
